name: Release Desktop App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin --bundles app,dmg"
            rustTargets: "x86_64-apple-darwin,aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            rustTargets: ""
          - platform: "windows-latest"
            args: "--bundles nsis"
            rustTargets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rustTargets == ''
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rustTargets != ''
        with:
          targets: ${{ matrix.rustTargets }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev
      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Install backend dependencies
        working-directory: backend-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build backend sidecar
        working-directory: backend-python
        run: pyinstaller --onefile app.py --name audit-backend
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Audit Interview Desktop ${{ github.ref_name }}"
          releaseBody: "自动构建的审计访谈清单桌面应用安装包。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
