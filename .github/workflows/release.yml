name: Release Desktop App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            artifactName: "macos-arm64"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rustTargets: "aarch64-apple-darwin"
            sidecarTarget: "aarch64-apple-darwin"
          - platform: "macos-15-intel"
            artifactName: "macos-x64"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rustTargets: "x86_64-apple-darwin"
            sidecarTarget: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            artifactName: "ubuntu-x64"
            args: "--bundles deb"
            rustTargets: ""
            sidecarTarget: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            artifactName: "windows-x64"
            args: "--bundles nsis"
            rustTargets: ""
            sidecarTarget: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rustTargets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rustTargets != ''
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install Windows NSIS
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # 固定安装 NSIS，避免 tauri-bundler 在 runner 缓存目录下载/解压工具时失败。
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Install backend dependencies
        working-directory: backend-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show build environment
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          python --version
          npm run tauri -- --version

      - name: Build Tauri app
        env:
          TAURI_SIDECAR_TARGET: ${{ matrix.sidecarTarget }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          # 统一收集安装包，缺少目标产物时直接失败，避免发布空 Release。
          set -euo pipefail
          mkdir -p release-assets
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.exe" \) > installer-files.txt
          if [ ! -s installer-files.txt ]; then
            echo "No installer files were generated."
            find src-tauri/target -maxdepth 6 -type f | sort
            exit 1
          fi
          while IFS= read -r file; do
            cp "$file" release-assets/
          done < installer-files.txt
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -lh release-assets

      - name: Delete existing release for tag
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const current = releases.find((release) => release.tag_name === context.ref_name);
            if (!current) {
              core.info(`No existing release found for ${context.ref_name}.`);
              return;
            }
            // 反复 force 更新同一个 tag 时，先删除旧 Release，避免同名安装包资产 already_exists。
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: current.id
            });
            core.info(`Deleted existing release ${current.id} for ${context.ref_name}.`);

      - uses: softprops/action-gh-release@v2
        with:
          name: "Audit Interview Desktop ${{ github.ref_name }}"
          body: "自动构建的审计访谈清单桌面应用安装包。"
          draft: true
          prerelease: false
          files: release-assets/*
